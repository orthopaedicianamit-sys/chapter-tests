<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Class 10 Chapter Tests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm column, like an exam booklet. The running test puts an
   exam-hall question palette beside the question on wide screens and under it on a phone. */
:root {
  --paper: #f1f5f4;
  --sheet: #ffffff;
  --ink: #13232a;
  --muted: #55686f;
  --line: #d2dddb;
  --accent: #0a6767;
  --accent-ink: #ffffff;
  --accent-soft: #d8ece9;
  --good: #19783f;
  --good-soft: #def2e5;
  --bad: #b3372a;
  --bad-soft: #f9e2de;
  --warn: #8f6209;
  --warn-soft: #f7ebcd;
  --review: #5c43a8;
  --review-soft: #e7e1f6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1618; --sheet: #162124; --ink: #e5eeec; --muted: #94a7a9; --line: #29393c;
    --accent: #56c5b8; --accent-ink: #06201f; --accent-soft: #17383a;
    --good: #62cf8c; --good-soft: #163324; --bad: #f08273; --bad-soft: #3c1d19;
    --warn: #e3b558; --warn-soft: #382c12; --review: #ad9af0; --review-soft: #2a2347;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1618; --sheet: #162124; --ink: #e5eeec; --muted: #94a7a9; --line: #29393c;
  --accent: #56c5b8; --accent-ink: #06201f; --accent-soft: #17383a;
  --good: #62cf8c; --good-soft: #163324; --bad: #f08273; --bad-soft: #3c1d19;
  --warn: #e3b558; --warn-soft: #382c12; --review: #ad9af0; --review-soft: #2a2347;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 56px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.3rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; }
code, .mono { font-family: var(--font-data); font-size: 0.9em; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.brand { display: flex; align-items: center; gap: 12px; }
.omr { display: flex; gap: 4px; }
.omr i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); }
.omr i.on { background: var(--accent); border-color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.1; }
.brand-sub { color: var(--muted); font-size: 0.82rem; }
.tabs { display: flex; gap: 4px; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 6px 16px; cursor: pointer; color: var(--muted); font-weight: 700; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--paper); }

/* Shared pieces */
.page { display: flex; flex-direction: column; gap: 22px; }
.page.narrow { max-width: 640px; }
.lede { color: var(--muted); max-width: 62ch; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.btn { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 13px 26px; font-size: 1.05rem; }
.btn.small { padding: 5px 11px; font-size: 0.88rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.55; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 700; align-self: flex-start; }
.pill { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.pyq { background: var(--review-soft); color: var(--review); }
.pill.good { background: var(--good-soft); color: var(--good); }
.note { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); }
.msg { font-weight: 700; }
.msg.ok { color: var(--good); }
.msg.err { color: var(--bad); }

/* Test list */
.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.test-row { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.test-main { min-width: 0; flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; }
.meta { color: var(--muted); font-size: 0.93rem; }
.linkhint { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 0.9rem; border-top: 1px dashed var(--line); padding-top: 12px; }
.mine { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mine li { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mine .score { font-family: var(--font-data); font-weight: 600; }

/* Start screen */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); overflow: hidden; }
.facts div { padding: 12px 16px; border-right: 1px solid var(--line); }
.facts div:last-child { border-right: 0; }
.facts dt { font-size: 0.76rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 60ch; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; }
.field input, textarea { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.field input { max-width: 340px; }

/* Running test */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-top: -12px; }
.bar-title { font-family: var(--font-display); font-weight: 700; min-width: 0; }
.bar-sub { color: var(--muted); font-size: 0.86rem; }
.timer { font-family: var(--font-data); font-weight: 600; font-size: 1.35rem; font-variant-numeric: tabular-nums; padding: 4px 12px; border-radius: 10px; background: var(--sheet); border: 1.5px solid var(--line); }
.timer.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.timer.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.exam { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; margin-top: 20px; }
@media (min-width: 860px) { .exam { grid-template-columns: minmax(0, 1fr) 270px; align-items: start; } }
.qcard { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.qnum { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qtext { font-size: 1.14rem; line-height: 1.45; white-space: pre-line; max-width: 64ch; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .bubble { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--font-data); font-weight: 600; font-size: 0.9rem; }
.opt .otext { min-width: 0; padding-top: 3px; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .bubble { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.qnav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
.qnav .grp { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.review[aria-pressed="true"] { background: var(--review-soft); border-color: var(--review); color: var(--review); }
.palette { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.palette h2 { font-size: 1rem; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; }
.pbtn { height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; font-family: var(--font-data); font-weight: 600; font-size: 0.9rem; position: relative; }
.pbtn.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pbtn.flag { border-color: var(--review); box-shadow: inset 0 0 0 2px var(--review); }
.pbtn.flag::after { content: ""; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--review); border: 2px solid var(--sheet); }
.pbtn.cur { outline: 3px solid var(--ink); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--paper); }
.legend i.done { background: var(--accent); border-color: var(--accent); }
.legend i.flag { border-color: var(--review); box-shadow: inset 0 0 0 2px var(--review); }

/* Confirm overlay */
.overlay { position: fixed; inset: 0; background: rgba(8, 18, 20, 0.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--sheet); color: var(--ink); border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); }
.dialog ul { margin: 0; padding-left: 20px; }
.dialog .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

/* Result */
.scorehead { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: flex-end; }
.bigscore { font-family: var(--font-display); font-weight: 700; font-size: clamp(3rem, 12vw, 4.6rem); line-height: 0.95; letter-spacing: -0.02em; }
.bigscore small { font-size: 0.42em; color: var(--muted); font-weight: 500; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
.tally b { color: var(--ink); font-family: var(--font-data); }
.send { background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.send .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.send textarea { font-family: var(--font-data); font-size: 0.82rem; min-height: 176px; resize: vertical; word-break: break-all; }
.secs { display: flex; flex-direction: column; gap: 10px; }
.sec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.sec .track { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.sec .fill { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.sec .num { font-family: var(--font-data); font-size: 0.9rem; color: var(--muted); }
.revlist { display: flex; flex-direction: column; gap: 14px; }
.rq { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.rq .qtext { font-size: 1.02rem; }
.rq ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rq li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; }
.rq li .lt { font-family: var(--font-data); font-weight: 600; flex: none; }
.rq li .tx { min-width: 0; flex: 1; }
.rq li.right { background: var(--good-soft); border-color: var(--good); }
.rq li.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
.rq .why { color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; max-width: 68ch; }

/* Teacher */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); overflow: hidden; }
.stat { padding: 14px 18px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat .k { font-size: 0.76rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); font-size: 0.86rem; }
.chart { margin: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart figcaption { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-family: var(--font-data); font-size: 12px; }
.chart .val { fill: var(--ink); font-family: var(--font-data); font-size: 12px; font-weight: 600; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .dot { fill: var(--sheet); stroke: var(--accent); stroke-width: 2.5; }
.chart .dot.last { fill: var(--accent); }
.add { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.add textarea { min-height: 96px; font-family: var(--font-data); font-size: 0.85rem; resize: vertical; }
.add .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.table-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.76rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
td .acts { display: flex; flex-wrap: wrap; gap: 6px; }
td .pills { display: flex; flex-wrap: wrap; gap: 4px; }
.detail td { background: var(--paper); }
.dlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.dlist li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }
.dlist .mk { font-family: var(--font-data); font-weight: 600; }
.dlist .mk.ok { color: var(--good); }
.dlist .mk.no { color: var(--bad); }
.dlist .sub { color: var(--muted); font-size: 0.92rem; }
.topic { display: flex; flex-direction: column; gap: 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.empty { background: var(--sheet); border: 1.5px dashed var(--line); border-radius: 14px; padding: 26px 20px; color: var(--muted); }
.empty b { color: var(--ink); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mode { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.mode p { color: var(--muted); font-size: 0.95rem; flex: 1; }
.shown { cursor: default; }
.shown:hover { border-color: var(--line); }
.opt.shown.right { border-color: var(--good); background: var(--good-soft); }
.opt.shown.right .bubble { background: var(--good); border-color: var(--good); color: var(--sheet); }
.opt.shown.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.opt.shown.wrongpick .bubble { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.feedback { border-radius: 12px; padding: 14px 16px; border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 6px; max-width: 68ch; }
.feedback.ok { border-color: var(--good); background: var(--good-soft); }
.feedback.no { border-color: var(--bad); background: var(--bad-soft); }
.feedback b { font-family: var(--font-display); font-size: 1.05rem; }
.pbtn.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.pbtn.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.pbtn.ok::after, .pbtn.no::after { position: absolute; top: -7px; right: -6px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; line-height: 1; background: var(--sheet); border: 1.5px solid currentColor; }
.pbtn.ok::after { content: "✓"; }
.pbtn.no::after { content: "✗"; }
.legend i.ok { background: var(--good-soft); border-color: var(--good); }
.legend i.no { background: var(--bad-soft); border-color: var(--bad); }
.palette .row { display: flex; flex-direction: column; gap: 8px; }
.page.narrow.wide-start { max-width: 860px; }
.fc-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 680px; width: 100%; margin: 20px auto 0; }
.fc { perspective: 1400px; cursor: pointer; border-radius: 18px; }
.fc-inner { display: grid; transition: transform 0.45s ease; transform-style: preserve-3d; }
.fc-inner.flipped { transform: rotateY(180deg); }
.fc-face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; min-height: 280px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--sheet); padding: 26px 24px; display: flex; flex-direction: column; gap: 14px; }
.fc-face p { font-size: 1.22rem; line-height: 1.45; white-space: pre-line; flex: 1; display: flex; align-items: center; }
.fc-back { transform: rotateY(180deg); border-color: var(--accent); background: var(--accent-soft); }
.fc-hint { color: var(--muted); font-size: 0.88rem; }
.fc-ctl { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.fc-ctl .grp { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.learn { border-color: var(--warn); color: var(--warn); }
.btn.know { background: var(--good); border-color: var(--good); color: var(--sheet); }
.fc-progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fc-progress span { display: block; height: 100%; background: var(--accent); }
@media (prefers-reduced-motion: reduce) { .fc-inner { transition: none; } }
@media (prefers-reduced-motion: no-preference) { .btn, .opt, .pbtn { transition: border-color 0.12s, background-color 0.12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="omr" aria-hidden="true"><i></i><i class="on"></i><i></i><i></i></div>
      <div>
        <div class="brand-name">Chapter Tests</div>
        <div class="brand-sub">Class 10 · NCERT Science</div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views" hidden>
      <button type="button" id="tab-teacher" data-act="tab" data-tab="teacher">Results</button>
      <button type="button" id="tab-home" data-act="tab" data-tab="home">Tests</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div id="overlay" class="overlay" hidden></div>

<script>

      'Name: ' + att.n + '\nScore: ' + sc.score + '/' + sc.total + ' (' + sc.pct + '%)\n' +
      'Time: ' + fmtDur(att.d) + ' of ' + test.minutes + ' min' + (att.x ? ' (time ran out)' : '') + '\n' +
      'Result code: ' + code;
  }

  /* ---------- navigation ---------- */
  function go(view, id) {
    state.view = view;
    if (id !== undefined) state.testId = id;
    state.startErr = ''; state.copyMsg = '';
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function render() {
    tabs.hidden = !state.teacher || state.view === 'test';
    document.getElementById('tab-teacher').setAttribute('aria-current', state.view === 'teacher' ? 'page' : 'false');
    document.getElementById('tab-home').setAttribute('aria-current', state.view !== 'teacher' ? 'page' : 'false');
    if (state.view === 'start') app.innerHTML = viewStart();
    else if (state.view === 'test') { app.innerHTML = viewTest(); tick(); }
    else if (state.view === 'result') app.innerHTML = viewResult();
    else if (state.view === 'practice') app.innerHTML = viewPractice();
    else if (state.view === 'practice-done') app.innerHTML = viewPracticeDone();
    else if (state.view === 'cards') app.innerHTML = viewCards();
    else if (state.view === 'cards-done') app.innerHTML = viewCardsDone();
    else if (state.view === 'teacher') app.innerHTML = viewTeacher();
    else app.innerHTML = viewHome();
  }

  /* ---------- student: home and start ---------- */
  function testMeta(t) { return (t.level ? t.level + ' · ' : '') + t.questions.length + ' questions · ' + t.minutes + ' minutes · ' + t.marks + ' mark each' + (boardCount(t) ? ' · ' + boardCount(t) + ' based on CBSE board questions' : ''); }
  function boardCount(t) { return t.questions.filter(function (q) { return q.pyq && /CBSE/.test(q.pyq); }).length; }
  function pyqPill(q) { return q.pyq && /CBSE/.test(q.pyq) ? ' <span class="pill pyq">' + esc(q.pyq.replace(/^CBSE/, 'CBSE board')) + '</span>' : ''; }
  function viewHome() {
    var rows = TESTS.map(function (t) {
      return '<li class="test-row"><div class="test-main"><div class="eyebrow">' + esc(t.chapter) + '</div><h2>' + esc(t.title) + '</h2>' +
        '<div class="meta">' + esc(testMeta(t)) + '</div></div>' +
        '<button type="button" class="btn primary" data-act="open" data-id="' + esc(t.id) + '">Open test</button>' +
        (state.teacher ? '<div class="linkhint">To open this chapter directly, add <code>#' + esc(t.id) + '</code> to the end of the page link.' +
          ' <button type="button" class="btn small" data-act="copy" data-text="#' + esc(t.id) + '">Copy ending</button></div>' : '') +
        '</li>';
    }).join('');
    var mine = lsGet('ct.mine') || [], mineHtml = '';
    if (mine.length) {
      mineHtml = '<h2>Your results on this device</h2><ul class="mine">' + mine.slice().reverse().map(function (m, i) {
        return '<li><span><b>' + esc(m.title) + '</b><br><span class="meta">' + esc(fmtDate(m.at)) + '</span></span>' +
          '<span class="score">' + esc(m.score) + '/' + esc(m.total) + ' · ' + esc(m.pct) + '%</span>' +
          '<button type="button" class="btn small" data-act="copy" data-text="' + esc(m.msg) + '">Copy result message</button></li>';
      }).join('') + '</ul>';
    }
    return '<section class="page"><div><h1>Chapter tests</h1></div>' +
      '<p class="lede">Each test is timed and covers one chapter of the NCERT textbook. Open a chapter, enter your name and start when you are ready.</p>' +
      '<ul class="tests">' + rows + '</ul>' + (state.copyMsg ? '<p class="msg ok" role="status">' + esc(state.copyMsg) + '</p>' : '') + mineHtml + '</section>';
  }
  function viewStart() {
    var t = testById(state.testId); if (!t) return viewHome();
    var name = lsGet('ct.name') || '', ps = lsGet('ct.practice'), pracSaved = !!(ps && ps.testId === t.id);
    return '<section class="page narrow wide-start">' +
      '<button type="button" class="link" data-act="home">← All tests</button>' +
      '<div><div class="eyebrow">' + esc(t.cls + ' ' + t.subject + ' · ' + t.chapter) + '</div><h1>' + esc(t.title) + '</h1></div>' +
      '<dl class="facts"><div><dt>Questions</dt><dd>' + t.questions.length + '</dd></div><div><dt>Time</dt><dd>' + t.minutes + ' min</dd></div>' +
      (t.level ? '<div><dt>Level</dt><dd>' + esc(t.level) + '</dd></div>' : '') + '<div><dt>Marking</dt><dd>+' + t.marks + ' each' + (t.negative ? ', −' + t.negative + ' wrong' : ', no negative') + '</dd></div></dl>' +
      '<div class="field"><label for="student-name">Your name</label>' +
      '<input id="student-name" type="text" maxlength="30" autocomplete="given-name" value="' + esc(name) + '"></div>' +
      (state.startErr ? '<p class="msg err" role="alert">' + esc(state.startErr) + '</p>' : '') +
      '<div class="modes">' +
      '<div class="mode"><h2>Timed test</h2><p>' + t.minutes + ' minutes. The timer cannot be paused and the test submits itself when time runs out. After you submit you see every answer with its explanation, and you send your result so that your score is recorded.</p>' +
      '<button type="button" class="btn primary big" data-act="start">Start timed test</button></div>' +
      '<div class="mode"><h2>Untimed practice</h2><p>No timer. After each answer you see straight away whether it was right, with a fuller explanation. Practice scores are not recorded. Best done after the timed test.</p>' +
      '<button type="button" class="btn big" data-act="practice">' + (pracSaved ? 'Continue practice' : 'Practise untimed') + '</button></div>' +
      '<div class="mode"><h2>Flashcards</h2><p>Revise the key fact behind each question, one card at a time. Tap a card to turn it over, then mark whether you knew it.</p>' +
      '<button type="button" class="btn big" data-act="cards-start">Revise with flashcards</button></div>' +
      '</div>' +
      '<p class="meta">Questions are based on ' + esc(t.book) + ', ' + esc(t.chapter) + '.</p></section>';
  }
  function startTest() {
    var t = testById(state.testId), el = document.getElementById('student-name');
    var name = (el ? el.value : '').replace(/\s+/g, ' ').trim();
    if (!name) { state.startErr = 'Enter your name to start.'; render(); var e2 = document.getElementById('student-name'); if (e2) e2.focus(); return; }
    lsSet('ct.name', name);
    var optOrder = {};
    t.questions.forEach(function (q) { optOrder[q.id] = q.fixed ? [0, 1, 2, 3] : shuffle([0, 1, 2, 3]); });
    state.run = { testId: t.id, name: name, startedAt: Date.now(), order: shuffle(t.questions.map(function (q) { return q.id; })),
      optOrder: optOrder, answers: {}, marked: {}, cur: 0, leaves: 0 };
    saveRun();
    startTimer();
    go('test');
  }
  function saveRun() { if (state.run) lsSet('ct.run', state.run); }

  /* ---------- student: running test ---------- */
  function remaining() { var t = testById(state.run.testId); return t.minutes * 60 - (Date.now() - state.run.startedAt) / 1000; }
  function startTimer() { stopTimer(); timerId = setInterval(tick, 250); }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function tick() {
    if (!state.run || state.view !== 'test') return;
    var left = remaining();
    if (left <= 0) { finish(true); return; }
    var el = document.getElementById('timer');
    if (el) {
      var txt = fmtClock(Math.ceil(left));
      if (el.textContent !== txt) el.textContent = txt;
      el.className = 'timer' + (left <= 60 ? ' bad' : left <= 300 ? ' warn' : '');
    }
  }
  function answeredCount() { var n = 0; for (var k in state.run.answers) if (state.run.answers[k] != null) n++; return n; }
  function viewTest() {
    var r = state.run, t = testById(r.testId), qid = r.order[r.cur], q = qById(t, qid), n = r.order.length;
    var opts = r.optOrder[qid].map(function (orig, i) {
      var on = r.answers[qid] === orig;
      return '<button type="button" class="opt" role="radio" aria-checked="' + on + '" data-act="pick" data-o="' + orig + '">' +
        '<span class="bubble">' + LETTERS[i] + '</span><span class="otext">' + esc(q.opts[orig]) + '</span></button>';
    }).join('');
    var pal = r.order.map(function (id, i) {
      var cls = 'pbtn' + (r.answers[id] != null ? ' done' : '') + (r.marked[id] ? ' flag' : '') + (i === r.cur ? ' cur' : '');
      var lab = 'Question ' + (i + 1) + (r.answers[id] != null ? ', answered' : ', not answered') + (r.marked[id] ? ', marked for review' : '');
      return '<button type="button" class="' + cls + '" data-act="jump" data-i="' + i + '" aria-label="' + lab + '">' + (i + 1) + '</button>';
    }).join('');
    return '<div class="bar"><div><div class="bar-title">' + esc(t.title) + '</div>' +
      '<div class="bar-sub">' + answeredCount() + ' of ' + n + ' answered</div></div>' +
      '<div class="timer" id="timer" role="timer" aria-label="Time left">' + fmtClock(Math.ceil(remaining())) + '</div></div>' +
      '<div class="exam"><section class="qcard" aria-label="Question">' +
      '<div class="qnum">Question ' + (r.cur + 1) + ' of ' + n + (r.marked[qid] ? ' <span class="pill" style="background:var(--review-soft);color:var(--review)">Marked for review</span>' : '') + '</div>' +
      '<p class="qtext">' + esc(q.q) + '</p>' +
      '<div class="opts" role="radiogroup" aria-label="Answer choices">' + opts + '</div>' +
      '<div class="qnav"><div class="grp">' +
      '<button type="button" class="btn" data-act="prev"' + (r.cur === 0 ? ' disabled' : '') + '>← Previous</button>' +
      '<button type="button" class="btn review" data-act="mark" aria-pressed="' + !!r.marked[qid] + '">' + (r.marked[qid] ? 'Unmark' : 'Mark for review') + '</button>' +
      '<button type="button" class="btn" data-act="clear"' + (r.answers[qid] == null ? ' disabled' : '') + '>Clear answer</button></div>' +
      (r.cur < n - 1 ? '<button type="button" class="btn primary" data-act="next">Next →</button>'
        : '<button type="button" class="btn primary" data-act="ask-submit">Submit test</button>') +
      '</div></section>' +
      '<aside class="palette" aria-label="Question palette"><h2>Questions</h2><div class="pgrid">' + pal + '</div>' +
      '<div class="legend"><span><i class="done"></i>Answered</span><span><i></i>Not answered</span><span><i class="flag"></i>Marked for review</span></div>' +
      '<button type="button" class="btn" data-act="ask-submit">Submit test</button></aside></div>';
  }
  function askSubmit() {
    var r = state.run, n = r.order.length, a = answeredCount(), m = 0;
    for (var k in r.marked) if (r.marked[k]) m++;
    overlay.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-h"><h2 id="dlg-h">Submit the test?</h2>' +
      '<ul><li>' + a + ' of ' + n + ' answered</li>' + (n - a ? '<li>' + (n - a) + ' not answered</li>' : '') +
      (m ? '<li>' + m + ' marked for review</li>' : '') + '<li>Time left: ' + fmtClock(Math.ceil(remaining())) + '</li></ul>' +
      '<p class="meta">You cannot change your answers after you submit.</p>' +
      '<div class="row"><button type="button" class="btn" data-act="cancel-submit">Go back</button>' +
      '<button type="button" class="btn primary" id="dlg-ok" data-act="do-submit">Submit test</button></div></div>';
    overlay.hidden = false;
    var b = document.getElementById('dlg-ok'); if (b) b.focus();
  }
  function closeOverlay() { overlay.hidden = true; overlay.innerHTML = ''; }
  function finish(auto) {
    var r = state.run; if (!r) return;
    stopTimer(); closeOverlay();
    var t = testById(r.testId), limit = t.minutes * 60;
    var dur = auto ? limit : Math.min(limit, Math.max(1, Math.round((Date.now() - r.startedAt) / 1000)));
    var ans = t.questions.map(function (q) { return r.answers[q.id] == null ? '-' : String(r.answers[q.id]); }).join('');
    var att = { t: t.id, n: r.name, s: r.startedAt, d: dur, x: auto ? 1 : 0, l: r.leaves || 0, a: ans };
    showResult(att);
    var res = state.result, mine = lsGet('ct.mine') || [];
    mine.push({ t: t.id, title: t.title, at: new Date(att.s + att.d * 1000).toISOString(), score: res.sc.score, total: res.sc.total, pct: res.sc.pct, msg: res.msg });
    lsSet('ct.mine', mine.slice(-30));
    lsDel('ct.run'); state.run = null;
    go('result');
  }
  function showResult(att) {
    var t = testById(att.t), sc = scoreAnswers(t, att.a), code = makeCode(att);
    state.result = { att: att, test: t, sc: sc, code: code, msg: resultMessage(t, att, sc, code) };
    state.saveMsg = null;
  }

  /* ---------- student: result ---------- */
  function secBars(sections) {
    return '<div class="secs">' + sections.map(function (s) {
      var p = s.t ? Math.round(s.c / s.t * 100) : 0;
      return '<div class="sec"><span>' + esc(s.name) + '</span><span class="num">' + s.c + '/' + s.t + '</span>' +
        '<span class="track"><span class="fill" style="width:' + p + '%"></span></span></div>';
    }).join('') + '</div>';
  }
  function reviewHtml(sc) {
    return sc.per.map(function (p, i) {
      var items = p.q.opts.map(function (o, k) {
        var right = k === p.q.ans, picked = k === p.chosen;
        var tag = right ? (picked ? 'Correct answer · your answer' : 'Correct answer') : (picked ? 'Your answer' : '');
        return '<li class="' + (right ? 'right' : picked ? 'wrongpick' : '') + '"><span class="lt">' + (right ? '✓' : picked ? '✗' : '·') + '</span>' +
          '<span class="tx">' + esc(o) + (tag ? ' <span class="pill ' + (right ? 'good' : 'bad') + '">' + tag + '</span>' : '') + '</span></li>';
      }).join('');
      var status = p.chosen === null ? '<span class="pill warn">Not answered</span>' : p.ok ? '<span class="pill good">Correct</span>' : '<span class="pill bad">Wrong</span>';
      return '<div class="rq"><div class="qnum">Question ' + (i + 1) + ' · ' + esc(p.q.sec) + ' ' + status + pyqPill(p.q) + '</div>' +
        '<p class="qtext">' + esc(p.q.q) + '</p><ol>' + items + '</ol><p class="why">' + esc(p.q.exp) + '</p></div>';
    }).join('');
  }
  function viewResult() {
    var R = state.result; if (!R) return viewHome();
    var sc = R.sc, att = R.att, t = R.test;
    var review = reviewHtml(sc);
    var wa = 'https://wa.me/?text=' + encodeURIComponent(R.msg);
    var save = '';
    if (state.teacher && state.db) {
      save = '<div class="row"><button type="button" class="btn" data-act="save-here">Save to score history</button>' +
        (state.saveMsg ? '<span class="msg ' + state.saveMsg.cls + '" role="status">' + esc(state.saveMsg.text) + '</span>' : '') + '</div>';
    }
    return '<section class="page">' +
      '<div><div class="eyebrow">' + esc(t.chapter + ' · ' + t.title) + '</div><h1>' + (att.x ? 'Time ran out. Your test was submitted.' : 'Test submitted') + '</h1></div>' +
      '<div class="scorehead"><div class="bigscore">' + sc.score + '<small>/' + sc.total + '</small></div>' +
      '<div><div style="font-family:var(--font-display);font-weight:700;font-size:1.5rem">' + sc.pct + '%</div>' +
      '<div class="tally"><span><b>' + sc.correct + '</b> correct</span><span><b>' + sc.wrong + '</b> wrong</span><span><b>' + sc.skipped + '</b> not answered</span><span><b>' + esc(fmtDur(att.d)) + '</b> taken</span></div></div></div>' +
      '<div class="send"><h2>Send your result</h2>' +
      '<p>Your score is recorded only when you send this message to the person who set the test.</p>' +
      '<div class="row"><a class="btn primary" href="' + esc(wa) + '" target="_blank" rel="noopener">Send on WhatsApp</a>' +
      '<button type="button" class="btn" data-act="copy-result">Copy message</button>' +
      (state.copyMsg ? '<span class="msg ok" role="status">' + esc(state.copyMsg) + '</span>' : '') + '</div>' +
      '<textarea id="result-msg" readonly aria-label="Result message">' + esc(R.msg) + '</textarea>' + save + '</div>' +
      '<div><h2 style="margin-bottom:12px">By topic</h2>' + secBars(sc.sections) + '</div>' +
      '<div><h2 style="margin-bottom:12px">Review your answers</h2><div class="revlist">' + review + '</div></div>' +
      '<div class="send" style="background:var(--sheet);border-color:var(--line)"><h2>Go through it again, untimed</h2>' +
      '<p>Practise the same questions with no timer and a fuller explanation after each answer, or revise the key facts with flashcards. Practice scores are not recorded.</p>' +
      '<div class="row"><button type="button" class="btn primary" data-act="practice-from-result">Practise untimed</button>' +
      '<button type="button" class="btn" data-act="cards-from-result">Revise with flashcards</button>' +
      '<button type="button" class="btn" data-act="home">Back to all tests</button></div></div></section>';
  }

  /* ---------- student: untimed practice ---------- */
  function hasTimed(t) {
    var mine = lsGet('ct.mine') || [];
    return mine.some(function (m) { return m.t === t.id || (!m.t && m.title === t.title); });
  }
  function savePrac() { if (state.prac) lsSet('ct.practice', state.prac); }
  function askPractice() {
    var t = testById(state.testId), saved = lsGet('ct.practice');
    if (saved && saved.testId === t.id && saved.order && saved.optOrder) { state.prac = saved; if (!state.prac.answers) state.prac.answers = {}; go('practice'); return; }
    if (hasTimed(t) || state.teacher) { beginPractice(); return; }
    askGate('Practise before the timed test?', 'Practice shows the correct answer after every question.', 'practice-go', 'Practise anyway');
  }
  function askGate(title, why, act, label) {
    overlay.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-h"><h2 id="dlg-h">' + esc(title) + '</h2>' +
      '<p>' + esc(why) + ' If you want a true score, take the timed test first.</p>' +
      '<div class="row"><button type="button" class="btn" id="dlg-ok" data-act="cancel-submit">Go back</button>' +
      '<button type="button" class="btn primary" data-act="' + act + '">' + esc(label) + '</button></div></div>';
    overlay.hidden = false;
    var b = document.getElementById('dlg-ok'); if (b) b.focus();
  }

  /* ---------- student: flashcards ---------- */
  function cardsFor(t) {
    return t.questions.map(function (q) {
      if (q.card) return { id: q.id, sec: q.sec, f: q.card.f, b: q.card.b };
      return { id: q.id, sec: q.sec, f: q.q, b: q.opts[q.ans] + '\n\n' + q.exp };
    });
  }
  function askCards() {
    var t = testById(state.testId);
    if (hasTimed(t) || state.teacher) { beginCards(t.id); return; }
    askGate('Use flashcards before the timed test?', 'The flashcards give away the answers to this test.', 'cards-go', 'Show flashcards');
  }
  function beginCards(testId, onlyIds) {
    closeOverlay();
    var t = testById(testId), ids = onlyIds && onlyIds.length ? onlyIds : cardsFor(t).map(function (c) { return c.id; });
    state.cards = { testId: testId, order: shuffle(ids), i: 0, flipped: false, known: {} };
    go('cards');
  }
  function viewCards() {
    var c = state.cards; if (!c) return viewHome();
    var t = testById(c.testId), all = cardsFor(t), byId = {};
    all.forEach(function (x) { byId[x.id] = x; });
    var card = byId[c.order[c.i]], n = c.order.length, k = 0;
    c.order.forEach(function (id) { if (c.known[id]) k++; });
    var pct = Math.round(c.i / n * 100);
    return '<div class="bar"><div><div class="bar-title">' + esc(t.title) + '</div>' +
      '<div class="bar-sub">Flashcards · card ' + (c.i + 1) + ' of ' + n + ' · ' + k + ' known</div></div>' +
      '<button type="button" class="btn small" data-act="cards-exit">Done</button></div>' +
      '<div class="fc-wrap"><div class="fc-progress" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
      '<div class="fc" id="fc" role="button" tabindex="0" data-act="c-flip" aria-label="' + (c.flipped ? 'Answer side. Tap to see the question again.' : 'Question side. Tap to see the answer.') + '">' +
      '<div class="fc-inner' + (c.flipped ? ' flipped' : '') + '">' +
      '<div class="fc-face fc-front"' + (c.flipped ? ' aria-hidden="true"' : '') + '><div class="eyebrow">Question · ' + esc(card.sec) + '</div><p>' + esc(card.f) + '</p><div class="fc-hint">Tap the card to see the answer</div></div>' +
      '<div class="fc-face fc-back"' + (c.flipped ? '' : ' aria-hidden="true"') + '><div class="eyebrow">Answer</div><p>' + esc(card.b) + '</p><div class="fc-hint">Did you know it?</div></div>' +
      '</div></div>' +
      '<div class="fc-ctl"><button type="button" class="btn" data-act="c-prev"' + (c.i === 0 ? ' disabled' : '') + '>← Previous</button>' +
      (c.flipped
        ? '<div class="grp"><button type="button" class="btn learn" data-act="c-learn">Still learning</button><button type="button" class="btn know" id="c-know" data-act="c-know">I knew it</button></div>'
        : '<button type="button" class="btn primary" data-act="c-flip">Show answer</button>') +
      '</div></div>';
  }
  function cardsNext() {
    var c = state.cards;
    c.flipped = false;
    if (c.i < c.order.length - 1) { c.i++; render(); var el = document.getElementById('fc'); if (el) try { el.focus(); } catch (e) {} }
    else go('cards-done');
  }
  function viewCardsDone() {
    var c = state.cards; if (!c) return viewHome();
    var t = testById(c.testId), n = c.order.length, k = 0;
    c.order.forEach(function (id) { if (c.known[id]) k++; });
    var left = n - k;
    return '<section class="page narrow"><div><div class="eyebrow">' + esc(t.chapter + ' · ' + t.title) + '</div><h1>Deck finished</h1></div>' +
      '<div class="scorehead"><div class="bigscore">' + k + '<small>/' + n + '</small></div><div class="tally"><span><b>' + k + '</b> known</span><span><b>' + left + '</b> still learning</span></div></div>' +
      '<p class="lede">' + (left ? 'Go through the cards you are still learning until you know them all.' : 'You knew every card. Shuffle the deck and go again in a day or two to make it stick.') + '</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:10px">' +
      (left ? '<button type="button" class="btn primary" data-act="cards-left">Revise the ' + left + ' still-learning ' + (left === 1 ? 'card' : 'cards') + '</button>' : '') +
      '<button type="button" class="btn' + (left ? '' : ' primary') + '" data-act="cards-all">Shuffle all ' + cardsFor(t).length + ' cards</button>' +
      '<button type="button" class="btn" data-act="home">Back to all tests</button></div></section>';
  }
  function beginPractice() {
    closeOverlay();

    if (document.hidden) { hiddenAt = Date.now(); return; }
    /* Count it only when he was really away, not on a reload or a quick flicker. */
    if (hiddenAt && Date.now() - hiddenAt > 1500) { state.run.leaves = (state.run.leaves || 0) + 1; saveRun(); }
    hiddenAt = 0; tick();
  });
  var resizeT = null;
  window.addEventListener('resize', function () {
    if (state.view !== 'teacher') return;
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (state.view === 'teacher' && document.activeElement !== document.getElementById('import-text')) { keepImport(); render(); } }, 200);
  });
  window.addEventListener('hashchange', function () { if (state.view === 'home' || state.view === 'start' || state.view === 'teacher') routeHash(); });
  function routeHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h && testById(h)) { go('start', h); return true; }
    return false;
  }

  /* ---------- boot ---------- */
  var saved = lsGet('ct.run');
  if (saved && testById(saved.testId) && saved.order && saved.optOrder && saved.startedAt) {
    state.run = saved; state.testId = saved.testId;
    if (remaining() > 0) { state.view = 'test'; startTimer(); render(); } else finish(true);
  } else if (!routeHash()) render();
  initTeacher();
})();
</script>

</body>
</html>
